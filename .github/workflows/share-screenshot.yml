name: Share Screenshot Artifact
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: nmap-screenshot
          path: nmap-org-2026-09-04.png
          if-no-files-found: error
